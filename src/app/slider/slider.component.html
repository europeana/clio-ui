<span style="display: flex">
  <input
    id="range"
    type="range"
    min="0"
    max="80"
    step="20"
    [formControl]="internalControl"
    (blur)="onTouchedCallback()"
  />
  <label
    for="range"
    class="clio-state"
    [ngClass]="{
      'clio-state-unset': sliderValue() === null || sliderValue() === undefined,
      'clio-state-0': sliderValue() === 0,
      'clio-state-1': sliderValue() === 20,
      'clio-state-2': sliderValue() === 40,
      'clio-state-3': sliderValue() === 60,
      'clio-state-4': sliderValue() === 80
    }"
  >
  </label>
</span>
