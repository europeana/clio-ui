<app-header></app-header>

<a #downloadAnchor tabindex="-1"></a>

<ng-template
  #endpointConnection
  let-endpoint="endpoint"
  let-desc="desc"
  let-action="action"
  let-input="input"
  let-download="download"
>
  <li>
    <a class="go" (click)="action()">go</a>
  </li>
  <li class="parameter-field">
    @if (input) {
      <input (keydown.enter)="loadReportByBatchId()" #batchId />
    }
  </li>
  <li class="path" (click)="action()">
    {{ endpoint }}
  </li>
  <li class="download">
    @if (download) {
      <a class="csv" (click)="download()">csv</a>
    }
  </li>
  <li class="desc">
    {{ desc }}
  </li>
</ng-template>

<div class="page-content">
  <ul class="end-points">
    <!-- batchid needed -->
    <ng-container
      *ngTemplateOutlet="
        endpointConnection;
        context: {
          action: loadReportByBatchId.bind(this),
          endpoint: '/report-by-batch-id',
          input: true,
          desc: 'Get a report by creation timestamp',
        }
      "
    ></ng-container>

    <ng-container
      *ngTemplateOutlet="
        endpointConnection;
        context: {
          action: loadLatestReport.bind(this),
          download: downloadLatestReport.bind(this),
          endpoint: '/latest-report',
          desc: 'Get full report with the the latest link checking results',
        }
      "
    ></ng-container>

    <ng-container
      *ngTemplateOutlet="
        endpointConnection;
        context: {
          action: loadBatches.bind(this),
          download: downloadBatches.bind(this),
          endpoint: '/batches',
          desc: 'Get a historic overview of the most recent link checking batches',
        }
      "
    ></ng-container>

    <ng-container
      *ngTemplateOutlet="
        endpointConnection;
        context: {
          action: loadAvailableReports.bind(this),
          download: downloadAvailableReports.bind(this),
          endpoint: '/available-reports',
          desc: 'Get all available report details',
        }
      "
    ></ng-container>
  </ul>

  <br />
  <br />

  <pre>
  {{ data | json }}
  </pre>

  <ul *ngIf="error" class="error">
    <li>{{ error.status }} / {{ error.statusText }}</li>
    <li>
      {{ error.message }}
    </li>
    <li *ngIf="error.error; let errInner">
      {{ errInner.text }}
    </li>
  </ul>
</div>
