<div class="filters">
  @let filter = modelClioInfo().filterOps;

  @if (error) {
    <span style="colour: red">
      {{ error | json }}
    </span>
  }

  <ng-container *ngFor="let field of filter | keyvalue">
    <span class="checkbox-filter">
      <span class="filter-label">{{ field.key | renameFilter }}</span>
      @if (field.value.length > 5) {
        <span class="search-icon"></span>
        <input
          class="checkbox-filter-input"
          #filterEntries
          placeholder="Search ({{ field.value.length }} entries)"
          [(ngModel)]="optionFilters[field.key]"
        />
      }
    </span>

    <div class="filter-wrapper">
      <ul class="filter-height-maintainer">
        <li
          *ngFor="
            let option of filterList(optionFilters[field.key], field.value)
          "
        >
          &nbsp;
        </li>
      </ul>

      <ul class="filter">
        <li
          *ngFor="
            let option of filterList(optionFilters[field.key], field.value)
          "
        >
          <app-checkbox
            [form]="form"
            [controlName]="toInputSafeName(option)"
            [labelText]="option"
            [group]="field.key"
            (valueChanged)="updatePageUrl()"
            title="Test"
          ></app-checkbox>
        </li>
      </ul>
    </div>
  </ng-container>

  <div [formGroup]="form">
    <span class="filter-label">Links in Operation (%)</span>
    <span class="input-wrapper">
      <select
        data-e2e="score"
        formControlName="score"
        (change)="updatePageUrl()"
      >
        <option value="0">0% - 20%</option>
        <option value="20">20% - 40%</option>
        <option value="40">40% - 60%</option>
        <option value="60">60% - 80%</option>
        <option value="80">80% - 100%</option>
      </select>

      @let actualScore = form.value['score'];
      <span
        class="clio-state"
        [ngClass]="{
          'clio-state-0': actualScore === '0',
          'clio-state-1': actualScore === '20',
          'clio-state-2': actualScore === '40',
          'clio-state-3': actualScore === '60',
          'clio-state-4': actualScore === '80'
        }"
      >
      </span>
    </span>
  </div>

  <div [formGroup]="form">
    <span class="filter-label">Dataset Id(s)</span>
    <span class="input-wrapper">
      <input
        data-e2e="dataset-id"
        placeholder="dataset id"
        formControlName="datasetId"
        (keyUp.enter)="updatePageUrl()"
      />
      <a
        class="search-icon-solid"
        tabindex="0"
        (click)="updatePageUrl()"
        (keyUp.enter)="updatePageUrl()"
      ></a>
    </span>

    <span class="filter-label">Dataset Name</span>
    <span class="input-wrapper">
      <input
        data-e2e="dataset-name"
        placeholder="dataset name"
        formControlName="datasetName"
        (keyUp.enter)="updatePageUrl()"
      />
      <a
        class="search-icon-solid"
        tabindex="0"
        (click)="updatePageUrl()"
        (keyUp.enter)="updatePageUrl()"
      ></a>
    </span>

    <span class="filter-label">From</span>
    <span class="input-wrapper">
      <input
        type="date"
        data-e2e="date-from"
        formControlName="dateFrom"
        (change)="updatePageUrl()"
      />
      <a
        class="search-icon-solid"
        tabindex="0"
        (click)="updatePageUrl()"
        (keyUp.enter)="updatePageUrl()"
      ></a>
    </span>

    <span class="filter-label">To</span>
    <span class="input-wrapper">
      <input
        type="date"
        data-e2e="date-to"
        formControlName="dateTo"
        (change)="updatePageUrl()"
      />
      <a
        class="search-icon-solid"
        tabindex="0"
        (click)="updatePageUrl()"
        (keyUp.enter)="updatePageUrl()"
      ></a>
    </span>
  </div>
</div>
