<div class="filters">
  <ng-container *ngFor="let field of formControlFields">
    <app-checkbox
      [form]="form"
      [controlName]="field.name"
      [labelText]="field.label"
      [group]="'items'"
      (valueChanged)="updateFilter()"
      title="Test"
    ></app-checkbox>
  </ng-container>
</div>
