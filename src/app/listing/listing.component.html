<ul class="listing">
  <li>
    <span class="list-header">Report Id</span>
    <span class="list-header">Batch Id</span>
    <span class="list-header centre">Download</span>
    <span class="list-header centre">Dataset Id</span>
    <span class="list-header">Creation Time</span>
  </li>
  @for (latestItem of clioInfo().list; track latestItem) {
    <li>
      <span class="state-link">
        <span
          [ngClass]="{
            'clio-state-0': latestItem.score === 0,
            'clio-state-1': latestItem.score === 1,
            'clio-state-2': latestItem.score === 2,
            'clio-state-3': latestItem.score === 3,
            'clio-state-4': latestItem.score === 4
          }"
          class="clio-state"
        ></span>
        {{ latestItem.reportId }}
      </span>
      <a (click)="setSummaryBatchId(latestItem.batchId)">{{
        latestItem.batchId
      }}</a>
      <span class="centre">
        <a class="csv-download" target="_blank" [href]="latestItem.url">CSV</a>
      </span>
      <span class="centre">
        <a (click)="setSummaryDatasetId(latestItem.reportId)">
          {{ latestItem.datasetId }}
        </a>
      </span>

      <span style="display: flex; align-items: center">
        <span>
          {{ latestItem.creationTime | date: DATE_VERBOSE_FMT }}
        </span>
        <app-checkbox
          [form]="form"
          [controlName]="latestItem.reportId + ''"
          [title]="'include in top-level download'"
          [group]="'record_ids'"
          (valueChanged)="updateIds()"
        ></app-checkbox>
      </span>
    </li>
  }
</ul>
