name: '- helper (env file)'
run-name: ${{ github.actor }} is generating an env_file
on:
  workflow_call:
    inputs:
      deploy_environment:
        description: 'Environment to deploy to'
        required: true
        default: 'test'
        type: string
jobs:
  create-env-file:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_environment }}
    steps:
      - run: |
          touch env_file
          echo APP_DATASPACE_URL=${{ secrets.DATASPACE_URL }} >> env_file
          # FIXED: Swapped github.event.inputs to inputs context
          case ${{ inputs.deploy_environment }} in
            'production')
              echo APP_SERVER_API=${{ secrets.PRODUCTION_SERVER_API }} >> env_file
            ;;
            'acceptance')
              echo APP_SERVER_API=${{ secrets.ACCEPTANCE_SERVER_API }} >> env_file
            ;;
            'test')
              echo APP_SERVER_API=${{ secrets.TEST_SERVER_API }} >> env_file
            ;;
          esac
          cat env_file
      - uses: actions/upload-artifact@master
        with:
          name: envFile
          path: ./env_file
