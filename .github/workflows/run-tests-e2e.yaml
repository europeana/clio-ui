name: '- helper (e2e testing)'
on:
  workflow_call:
    inputs:
      tag_name:
        required: false
        type: string
        default: 'develop'
      run_build:
        required: false
        type: string
        default: 'false'
jobs:
  cypress:
    if: ${{ inputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run start:ci-data
          wait-on: 'npx wait-on tcp:127.0.0.1:3001'
          wait-on-timeout: 60
          command: npm run cypress:ci
