name: '- helper (e2e testing)'
on:
  workflow_call:
    inputs:
      tag_name:
        required: false
        type: string
        default: 'develop'
      run_build:
        required: false
        type: string
        default: 'false'
jobs:
  cypress:
    if: ${{ inputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'
      - run: npm install
      - name: Run Cypress Tests
        run: |
          (npm run start:ci-data) & (sleep 10 && npm run cypress:ci)
      - name: close test-data server
        if: success() || failure()
        run: |
          fuser -k 3000/tcp
  a11y:
    if: ${{ inputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'
      - run: npm install
      - name: Run Cypress AccessibilityTests
        run: |
          ((npm run start:ci-data & echo 'started test-data server')
          && sleep 10) & (npm run cypress:ci-accessibility)
      - name: close test-data server
        if: success() || failure()
        run: |
          fuser -k 3000/tcp
