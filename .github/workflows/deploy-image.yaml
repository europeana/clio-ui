name: '- helper (image deployment)'
on:
  workflow_call:
    inputs:
      deploy_environment:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      delete:
        required: true
        type: string

jobs:
  deploy-image:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_environment }}
    steps:
      - uses: actions/checkout@v5
      - name: Get Env File
        uses: actions/download-artifact@master
        with:
          name: envFile
          path: env_file
      - run: |
          mv env_file/env_file deployment/${{ inputs.deploy_environment }}
      - run: |
          tag=${{ inputs.tag_name || 'develop' }}
          TAG_ESCAPED=${tag//[\/]/_}
          echo TAG_ESCAPED=${TAG_ESCAPED} >> $GITHUB_ENV
      - name: Inject Variables
        run: |
          ENV_FILE_PATH="deployment/${{ inputs.deploy_environment }}/env_file"
          if [ -f "$ENV_FILE_PATH" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              [[ "$line" =~ ^#.*$ ]] || [ -z "$line" ] && continue
              export "$line"
            done < "$ENV_FILE_PATH"
          fi
          export APP_IMAGE='europeana/clio-ui:${{ env.TAG_ESCAPED }}'
          export MIN_REPLICAS='2'
          export MAX_REPLICAS='4'
          export UTILISATION_AVERAGE_PERCENT='75'
          export FILE_1=deployment/${{ inputs.deploy_environment }}/deployment.yaml
          export FILE_2=deployment/${{ inputs.deploy_environment }}/hpa.yaml
          envsubst < $FILE_1 | tee $FILE_1
          envsubst < $FILE_2 | tee $FILE_2
      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud --version
          ibmcloud config --check-version=false
          ibmcloud plugin install -f kubernetes-service
          ibmcloud plugin install -f container-registry
      - name: Login to IBM
        run: |
          ibmcloud login -a "${{ secrets.IBM_CLOUD_API_ENDPOINT}}" -r "${{ secrets.IBM_CLOUD_REGION}}" --apikey "${{ secrets.IBM_GEN_API_KEY }}"
          echo 'logged in to IBM'
      - name: Configure Cluster
        run: |
          K8s_CLUSTER_NAME=${{ secrets.IBM_CLOUD_K8S_CLUSTER_NAME }} && [[ ${{ inputs.deploy_environment }} == 'production' ]]  && K8s_CLUSTER_NAME=europeana
          ibmcloud ks cluster config --cluster $K8s_CLUSTER_NAME
          echo 'configured cluster'
          sleep 5
      - name: Push image
        run: |
          CTX_K8s=${{ secrets.TEST_K8S_CONTEXT }} && [[ ${{ inputs.deploy_environment }} == 'production' ]]  && CTX_K8s=${{ secrets.PRODUCTION_K8S_CONTEXT }}
          if [[ "${{ inputs.delete }}" == "true" ]]
          then
            kubectl --context $CTX_K8s delete -n ${{ inputs.deploy_environment }} -k deployment/${{ inputs.deploy_environment }}
          else
            kubectl --context $CTX_K8s apply -n ${{ inputs.deploy_environment }} -k deployment/${{ inputs.deploy_environment }}
          fi
