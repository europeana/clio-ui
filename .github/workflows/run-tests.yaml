name: '- helper (unit testing)'
on:
  workflow_call:
    inputs:
      tag_name:
        required: false
        type: string
        default: 'develop'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'
      - run: npm install
      - run: |
          npm run test:dev
      - run: |
          cp coverage/lcov.info .
      - uses: actions/upload-artifact@v4
        with:
          name: appLcov
          path: ./lcov.info
