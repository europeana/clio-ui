apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: acceptance
resources:
- deployment.yaml
- clio-ui-service.yaml
- ingress.yaml
- hpa.yaml
configMapGenerator:
- name: clio-ui-nginx-conf-acceptance
  files:
  - nginx.conf
secretGenerator:
- name: clio-ui-environment-acceptance
  envs:
  - env_file
generatorOptions:
  disableNameSuffixHash: true
  labels:
    type: generated
  annotations:
    note: generated
