apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clio-ui-ingress-acceptance
  annotations:
    cert-manager.io/issuer: letsencrypt-production
spec:
  ingressClassName: public-iks-k8s-nginx
  tls:
    - hosts:
        - clio-ui.acceptance.eanadev.org
      secretName: clio-ui.acceptance.eanadev.org
  rules:
    - host: clio-ui.acceptance.eanadev.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clio-ui-service-acceptance
                port:
                  number: 8080
